[package]
name = "bada-enigma"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC0-1.0"
publish = false
description = "bada enigma: a bada-compatible v1 joke IME. Henkan mode types through an Enigma machine."
repository = "https://github.com/team-mirae/bada-enigma"

[lib]
name = "enigma"
# rlib: tests and Rust hosts. cdylib: dlopen hosts, and the WebAssembly module the web page loads.
# staticlib: native shells.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
